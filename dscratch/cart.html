<!DOCTYPE html>
<html>
    <head>
        <title>Корзина - Doc Scratch - интернет-магазин CD и DVD дисков</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="styles/main.css" rel="stylesheet" media="all">
        <link href="styles/cart.css" rel="stylesheet" media="all">
    </head>
    <body>
        <header>
            <nav>
                <input type="checkbox" id="burgerToggle">
                <label for="burgerToggle" class="burgerIcon">
                    <span class="open">☰</span>
                    <span class="close">✕</span>
                </label>
                <ul class="nav left">
                    <li class="navItem"><a href="cd.html"><h1>CD</h1></a></li>
                    <li class="navItem"><a href="dvd.html"><h1>DVD</h1></a></li>
                    <li class="navItem mobile"><a href="faq.html"><h1>FAQ</h1></a></li>
                </ul>
                <ul class="nav center">
                    <li class="navLogo"><a href="index.html"><object data="logo.svg" type="image/svg+xml" style="pointer-events: none;"></object></a></li>
                </ul>
                <ul class="nav right">
                    <li class="navItem desktop"><a href="faq.html"><h1>FAQ</h1></a></li>
                    <li class="navCart"><a href="cart.html"><object data="cart.svg" type="image/svg+xml" style="pointer-events: none;"></object><svg width="60" height="60" viewBox="0 0 60 60" id="cartBadge"><circle cx="30" cy="30" r="30" style="fill:#87e8f9;"></circle><text id="productCount" x="33%" y="65%" font-size="25px" fill="#f7f7f8">0</text></svg></a></li>
                </ul>
            </nav>
        </header>
        <main>
         <div class="pagetitle">
            <p>Корзина</p>
            <p>Просмотр, изменение и оформление заказа</p>
         </div>
         <h3 id="cartProductCounter">Позиций в корзине: 0</h2>
         <div class="cart">
            <ul id="cart"></ul>
            <h2 id="total">Итого: 0</h2>
            <form class="form">
               <p>
                  <label class="label" for="name">ФИО: </label>
                  <input type="text" id="name" placeholder="ФИО">
               </p>
               <p>
                  <label class="label" for="phone">Контактный телефон: </label>
                  <input type="tel" id="phone" placeholder="Контактный телефон">
               </p>
               <p>
                  <label class="label" for="deliveryType">Способ доставки: </label>
                  <input type="radio" name="delivery" id="deliveryType-post" value="post"> Европочта (самовывоз) <input type="radio" checked name="delivery" id="deliveryType-courier" value="courier"> Курьер
               </p>
               <p>
                  <label class="label" for="address" id="addressType">Адрес: </label>
                  <input type="text" id="address" placeholder="Адрес">
               </p>
               <p>
                  <label class="label" for="paymentType">Способ оплаты: </label>
                  <input type="radio" id="paymentType-erip" checked name="payment"> ЕРИП <input type="radio" id="paymentType-cash" name="payment"> Наличные (только при доставке Европочтой)
               </p>
               <p><button id="submit">Заказать</button></p>
            </form>
         </div>
         <div id="confirmOrder"></div>
        </main>
        <footer>
            <p>Контактный телефон: +375(25)123-45-67</p>
            <p>E-mail: aaaaa@docscratch.by</p>
            <!--сбоку ещё ссылки на соцсети (мои)-->
            <p>(C) 2026</p>
        </footer>
        <script src="scripts/cart.js"></script>
    </body>
</html>
